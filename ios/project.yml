name: DeadAd

options:
  bundleIdPrefix: com.deadblock
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"

targets:
  DeadAd:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources/rules.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deadblock.app
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: Entitlements/DeadAd.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
    dependencies:
      - target: DNSProxy
      - sdk: NetworkExtension.framework

  DNSProxy:
    type: app-extension
    platform: iOS
    sources:
      - path: DNSProxy
      - path: Shared
      - path: Resources/rules.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.deadblock.app.dnsproxy
        CODE_SIGN_ENTITLEMENTS: Entitlements/DNSProxy.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info-DNSProxy.plist
    dependencies:
      - sdk: NetworkExtension.framework
